name: Software contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c constraints-native.txt -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/check_publication.py
