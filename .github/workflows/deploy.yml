name: Deploy private preview
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: oak-private-release
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.OAK_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: private-preview
    env:
      OAK_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      OAK_API_URL: ${{ vars.OAK_API_URL }}
      OAK_FRONTEND_URL: ${{ vars.OAK_FRONTEND_URL }}
      OAK_PREVIEW_USER: ${{ secrets.OAK_PREVIEW_USER }}
      OAK_PREVIEW_PASSWORD: ${{ secrets.OAK_PREVIEW_PASSWORD }}
      OAK_VERCEL_PROTECTION_BYPASS: ${{ secrets.OAK_VERCEL_PROTECTION_BYPASS }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Require the tested commit to remain at main
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Install release tools
        run: |
          uv sync --project backend --locked
          npm install --global vercel@65.12.1
          npm ci --prefix frontend
      - name: Save rollback targets and deploy backend
        working-directory: backend
        run: uv run python -m scripts.release backend
      - name: Build and deploy frontend after backend health check
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > release-url.txt
      - name: Check the deployed private application
        working-directory: backend
        run: uv run python -m scripts.release smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: |
            release.json
            release-url.txt
          retention-days: 90
