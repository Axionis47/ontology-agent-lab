[project]
name = "ontology-agent-lab-oak"
version = "0.1.0"
description = "Observable OaK-inspired ontology kernels over fixed external APIs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.6,<1",
    "neo4j>=5.28,<7",
    "owlready2>=0.49,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "strictdoc>=0.30.4,<0.31",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests/oak_contracts"]
norecursedirs = [".runtime", ".venv"]
