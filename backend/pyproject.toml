[project]
name = "oak-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.1",
  "uvicorn[standard]==0.54.0",
  "mcp==2.3.0",
  "psycopg[binary,pool]==3.3.8",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "httpx2==2.16.0",
  "cryptography==50.0.2",
  "google-genai==3.0.0",
  "jsonschema==4.26.0",
  "owlready2==0.51",
]

[project.optional-dependencies]
ontology-demo = []

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
