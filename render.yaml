services:
  - type: web
    name: oak-api
    runtime: docker
    plan: free
    branch: main
    rootDir: backend
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OAK_ENVIRONMENT
        value: production
      - key: OAK_SECRET_BACKEND
        value: vault
      - key: OAK_ALLOW_LOCAL_MCP
        value: "false"
      - key: OAK_API_KEY
        generateValue: true
      - key: OAK_DATABASE_URL
        sync: false
      - key: OAK_FRONTEND_URL
        sync: false
